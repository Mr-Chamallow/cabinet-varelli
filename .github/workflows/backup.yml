name: Sauvegarde Supabase

on:
  schedule:
    - cron: "0 3 * * 0" # chaque dimanche 03:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Installer pg_dump 17
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump + chiffrement
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges \
            | gzip \
            | gpg --symmetric --batch --yes --passphrase "$BACKUP_PASSPHRASE" -o backup-$(date +%F).sql.gz.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: backup-*.sql.gz.gpg
          retention-days: 60

      - name: Alerte Discord (succès)
        if: success()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ADMIN }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          curl -sS -H "Content-Type: application/json" -d '{"embeds":[{"title":"💾 Sauvegarde Supabase réussie","description":"Fichier chiffré disponible dans GitHub > Actions > Artifacts (60 jours).","color":2278750}]}' "$WEBHOOK"

      - name: Alerte Discord (échec)
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ADMIN }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          curl -sS -H "Content-Type: application/json" -d '{"embeds":[{"title":"❌ Sauvegarde Supabase ÉCHOUÉE","description":"Voir GitHub > Actions pour le détail.","color":15680580}]}' "$WEBHOOK"
