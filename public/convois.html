 d:"Récolte ou accès labo : véhicules de transaction + 4x4 et SUV, hors liste interdite.",
 bg:R(105,90)+LN(150)+ARW(30)+`<text class="note" x="560" y="95">3 km minimum des entrepôts et QG</text>`,
 it:[[1,"Nemesis","moto",850,150,"Éclaireur : surveille le labo."],[2,"Kamacho","off",740,150,"Pointe."],[3,"Rocoto","suv",620,150,"SUV de couverture (Novak et Rebla sont interdits en labo)."],[4,"Rumpo Trail","van",500,150,"Cargo : matières premières."],[5,"Speedo Custom 2","van",380,150,"Cargo : retour de production."]],
 why:["Seuls les véhicules autorisés en labo : on évite Novak, Rebla, Bison.","Convoi allégé : moins on attire l'attention, plus le labo reste discret."],
 rule:"Interdit en labo : Dune, Kalahari, Outlaw, Trophy Truck, Verus, Winky, Astron, Habanero, Radi, Serrano, Toros, Rebla, Novak, Jubilee, Gresley H. Les labos doivent rester à 3 km des entrepôts et QG."}
];
function veh(it){
  const [n,nom,k,x,y]=it;const moto=k==="moto";const w=moto?34:(k==="van"?66:58),h=moto?12:24;
  const num=n?`<text class="vl" x="${x}" y="${y}">${n}</text>`:"";
  return `<rect class="${KIND[k][1]}" x="${x-w/2}" y="${y-h/2}" width="${w}" height="${h}" rx="${moto?5:6}"><title>${nom}</title></rect>${num}`;
}
function kindOf(g){return {Direction:"dir","Escorte rapide":"sport","Berline discrète":"sedan","Tout-terrain":"off",SUV:"suv","Van cargo":"van",Moto:"moto",Support:"van"}[g]||"sport"}
function formation(i){
  const s=S[i];
  const svg=`<svg viewBox="0 0 900 300" role="img" aria-label="${s.t}">${s.bg||""}${s.it.map(veh).join("")}</svg>`;
  const kinds=[...new Set(s.it.map(r=>r[2]))];
  const legend=kinds.map(k=>`<span><span class="dot" style="background:${KIND[k][2]}"></span>${KIND[k][0]}</span>`).join("");
  const rows=s.it.filter(r=>r[0]).sort((a,b)=>a[0]-b[0]).map(r=>{const f=F[r[1]]||F[({"Rhinehart":"Ubermarcht Rhinehart"})[r[1]]]||null;return `<tr><td>${r[0]}</td><td><b>${r[1]}</b><br><small style="color:var(--dim)">${f?f.g:""}</small></td><td>${r[5]}</td></tr>`}).join("");
  return `<div class="board"><nav class="sub2" id="subtabs">${S.map((x,j)=>`<button role="tab" aria-selected="${j===i}" data-f="${j}">${x.tab}</button>`).join("")}</nav>
  <div class="legend">${legend}</div><div class="svgbox">${svg}</div>
  <div class="cols"><div><h2>${s.t}</h2><p class="sub" style="margin:.2rem 0 .8rem">${s.d}</p><h3>Pourquoi cette disposition</h3><ul class="l">${s.why.map(w=>`<li>${w}</li>`).join("")}</ul></div>
  <div><h3>Ordre de marche</h3><div class="tbl"><table><tr><th>N°</th><th>Véhicule</th><th>Mission</th></tr>${rows}</table></div></div></div>
  <div class="rule"><b>Règle.</b> ${s.rule}</div></div>`;
}
// ---------- Flotte ----------
let q="";
function flotte(){
  const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const list=FLEET.filter(f=>!q||norm(f.nom+" "+f.g+" "+f.role).includes(norm(q)));
  const units=FLEET.reduce((a,f)=>a+f.q,0),total=FLEET.reduce((a,f)=>a+f.q*f.prix,0);
  const groups={};FLEET.forEach(f=>{groups[f.g]=(groups[f.g]||0)+f.q});
  const order=["Direction","Berline discrète","Escorte rapide","Tout-terrain","SUV","Van cargo","Support","Moto"];
  const body=order.map(g=>{const rs=list.filter(f=>f.g===g);if(!rs.length)return"";
    return `<tr><td colspan="6"><h3 style="margin:.6rem 0 0"><span class="dot" style="background:${KIND[kindOf(g)][2]}"></span>${g} (${groups[g]})</h3></td></tr>`+rs.map(f=>`<tr><td><b>${f.nom}</b>${f.q>1?` <small>x${f.q}</small>`:""}${f.moto?` <small style="color:var(--dim)">moto : éclaireur seulement</small>`:""}<br><small style="color:var(--dim)">${f.role}</small></td><td class="r">${f.vit?f.vit+" km/h":"-"}</td><td class="r">${f.pl||"-"}</td><td class="r">${f.cof?f.cof+" kg":"-"}</td><td class="r">${fmt(f.prix)}</td></tr>`).join("")}).join("");
  return `<div class="board"><div class="stats"><div class="stat"><b>${units}</b><span>véhicules</span></div><div class="stat"><b>${(total/1e6).toFixed(2).replace(".",",")} M$</b><span>valeur de la flotte</span></div><div class="stat"><b>20</b><span>membres (25 au total)</span></div><div class="stat"><b>3</b><span>convois de 6 + 1</span></div></div>
  <input type="search" id="q" placeholder="🔍 Rechercher un véhicule, un rôle..." value="${q.replace(/"/g,"&quot;")}">
  <div class="tbl"><table><tr><th>Véhicule</th><th class="r">Vitesse</th><th class="r">Places</th><th class="r">Coffre</th><th class="r">Prix</th></tr>${body||'<tr><td colspan="5">Aucun résultat.</td></tr>'}</table></div>
  <div class="grid2"><div class="card"><h3>Retirés de la liste</h3><ul><li>Buffalo S, Sultan RS classic, Gresley : interdits aux organisations (catalogue FA).</li><li>Bison STX : gardé en support, interdit en transaction.</li></ul></div>
  <div class="card"><h3>À savoir</h3><ul><li>Novak et Rebla GTS : interdits en labo.</li><li>Paragon S et Maibatsu Arsher Pro 2 : au catalogue Elite Vinewood, non interdits.</li><li>Motos : ni braquage, ni vente de drogue. On les utilise comme éclaireurs.</li></ul></div></div></div>`;
}
// ---------- Rôles et radio ----------
const ROLES=`<div class="grid2">
<div class="card"><h3>Rôles dans un convoi</h3><ul>
<li><b>Chef de convoi</b> : donne le départ, l'arrêt et les changements de plan. Un seul à parler sur le canal de commandement.</li>
<li><b>Éclaireur</b> (moto) : 300 m devant. Signale contrôle, barrage, patrouille. Ne s'engage jamais.</li>
<li><b>Pointe</b> (tout-terrain) : fixe l'allure et choisit la voie.</li>
<li><b>Cargo</b> (vans) : protégés au centre, toujours à portée de l'escorte.</li>
<li><b>Escorte</b> : couvre les flancs, garde les intervalles.</li>
<li><b>Serre-file</b> : dernier véhicule, annonce les décrochages et ferme les carrefours.</li></ul></div>
<div class="card"><h3>Distances</h3><ul>
<li>Éclaireur : 300 m devant la pointe.</li>
<li>Intervalle en route : 40 à 60 m.</li>
<li>Intervalle en ville : 15 à 25 m, voies alternées.</li>
<li>Arrêt : 5 m entre véhicules, nez vers la sortie.</li>
<li>Guetteur sur une transaction : 200 m minimum.</li></ul></div>
<div class="card"><h3>Radio (brèves)</h3><ul>
<li><code>Oscar Mike</code> : en mouvement.</li><li><code>Contact</code> + direction : police ou hostile en vue.</li><li><code>Roger</code> / <code>Wilco</code> : reçu / sera fait.</li>
<li><code>Négatif</code> : non.</li><li><code>Break</code> : j'interromps pour une urgence.</li><li><code>Standby</code> : attends.</li>
<li><code>Rendez-compte</code> : demande de situation.</li><li><code>Alpha, Bravo</code> : convoi 1, convoi 2.</li><li><code>Fin de mission</code> : tout le monde au point de dispersion.</li></ul></div>
<div class="card"><h3>Plan PACE</h3><ul>
<li><b>P</b>rimaire : route normale, canal radio principal.</li>
<li><b>A</b>lternatif : deuxième route, deuxième canal.</li>
<li><b>C</b>ontingence : point de regroupement fixe, à pied si besoin.</li>
<li><b>E</b>mergence : dispersion et retour séparé au QG.</li>
<li>Le chef annonce le plan avant chaque départ.</li></ul></div></div>`;
// ---------- Procédures ----------
const PROC=`<div class="grid2">
<div class="card"><h3>Avant le départ</h3><ul>
<li>Briefing de 2 minutes : mission, route, plan PACE, qui est chef.</li>
<li>Vérifier carburant, état, kevlar visible (une pièce par joueur, 5 maximum en GDT).</li>
<li>Pas d'arme lourde sans 200 h de jeu, deux armes maximum par personne.</li>
<li>Test radio dans l'ordre de marche.</li></ul></div>
<div class="card"><h3>En route</h3><ul>
<li>Respecter l'ordre de marche et les intervalles. Pas de dépassement sans ordre.</li>
<li>Aucune conversation inutile sur le canal de commandement.</li>
<li>Pas de moto en action illégale en dehors du rôle d'éclaireur.</li>
<li>Le serre-file annonce tout décrochage.</li></ul></div>
<div class="card"><h3>Contact police</h3><ul>
<li>L'éclaireur annonce <code>Contact</code>, direction et nombre.</li>
<li>Décision du chef : dispersion ou arrêt. Pas de fuite hors-piste injustifiée.</li>
<li>Plan pneus interdit. Pas de tirs sur la police sans cadre RP validé.</li>
<li>On ne sacrifie jamais un cargo pour sauver une escorte.</li></ul></div>
<div class="card"><h3>Contact hostile</h3><ul>
<li>Pas de tir tant que le Lead n'a pas donné l'ordre (seul le Lead OP ordonne le tir).</li>
<li>Radio avant toute action offensive. Appel audible.</li>
<li>Pas de drive-by : réservé aux gangs et MC.</li>
<li>On cherche d'abord à sortir, on engage en dernier recours.</li></ul></div>
<div class="card"><h3>Panne ou véhicule perdu</h3><ul>
<li>Annoncer <code>Rendez-compte</code> avec position.</li>
<li>Le serre-file reste avec le véhicule, le convoi continue.</li>
<li>Le cargo est transféré avant tout abandon.</li></ul></div>
<div class="card"><h3>Retour et débrief</h3><ul>
<li>Tout le monde au point de dispersion, véhicules garés, armes rangées.</li>
<li>Débrief de 3 minutes : qu'est-ce qui était prévu, qu'est-ce qui s'est passé, qu'est-ce qu'on change.</li>
<li>Le chef note les erreurs, pas les coupables.</li></ul></div></div>
<div class="rule"><b>Principe.</b> On est d'anciens militaires et policiers : ordre, ponctualité, radio brève, débrief systématique. C'est notre signature, et c'est ce qui nous distingue des gangs.</div>`;
// ---------- Router ----------
const TABS=[["flotte","Flotte"],["form","Formations"],["roles","Rôles et radio"],["proc","Procédures"]];
let cur="flotte",fi=0;
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===cur));
  $("view").innerHTML=cur==="flotte"?flotte():cur==="form"?formation(fi):cur==="roles"?ROLES:PROC;
  const qi=$("q");if(qi){qi.addEventListener("input",e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$("q");n.focus();n.setSelectionRange(p,p)})}
}
$("tabs").innerHTML=TABS.map(t=>`<button role="tab" aria-selected="false" data-t="${t[0]}">${t[1]}</button>`).join("");
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){cur=b.dataset.t;render()}});
$("view").addEventListener("click",e=>{const b=e.target.closest("button[data-f]");if(b){fi=+b.dataset.f;render()}});
render();
</script></body></html>
